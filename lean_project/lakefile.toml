#                    matching tag v1.3.18_lean-toolchain-v4.32.0
#
# mathlib4 tag vX.Y.Z always declares leanprover/lean4:vX.Y.Z in its
# lean-toolchain, so naming the Mathlib tag after the Lean version is what
# keeps all three in lockstep. The historical breakage was Mathlib v4.32.2
# against a REPL with NO v4.32.2 tag -> 'unexpected token' /
# 'unknown constant'.
name = "verification"
defaultTargets = ["Verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
